global:
  scrape_interval: 15s        # как часто опрашивать цели
  evaluation_interval: 15s    # как часто вычислять правила

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # через Nginx: напрямую сервис из сети lab недоступен
  - job_name: audit-svc
    metrics_path: /metrics
    static_configs:
      - targets: [deploy-vm:8080]
        labels:
          instance: audit-svc

  - job_name: nginx
    static_configs:
      - targets: [deploy-vm:9113]
        labels:
          instance: nginx
